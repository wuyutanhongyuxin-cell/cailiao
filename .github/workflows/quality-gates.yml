name: quality-gates

# Runs the unified quality-gate runner on every push and pull request.
# The runner is the single source of truth for which checks gate the repo;
# CI simply invokes it, so local and CI results stay identical.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Stdlib only: no pip install step is required. The runner byte-compiles,
      # runs unit tests, the deterministic retrieval eval gate, git diff --check
      # and a secret/.env scan. It exits non-zero if any gate fails, failing CI.
      - name: Run quality gates
        run: python tools/run_quality_gates.py --json
